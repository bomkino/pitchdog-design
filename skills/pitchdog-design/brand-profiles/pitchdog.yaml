profile:
  id: "pitchdog"
  name: "pitch.dog"
  version: "2.0.0"
  status: "canonical-routing-profile"
  mode: "explicit-or-owned-artifact"
  principle: "Use our foundation. Give the subject its own answer."
  anti_sameness: "Same standard. Different idea."

authority:
  order:
    - "safety-consent-privacy-law-accessibility-authorization"
    - "current-user-constraints-and-protected-material"
    - "current-target-brand-authority-and-owner-decisions"
    - "audience-outcome-content-proof-and-medium"
    - "pitchdog-design-judgment"
    - "references-trends-and-polish"
  conflict_rule: "Newer owner-confirmed decisions outrank this installed profile."
  unresolved_rule: "Preserve ambiguity; do not invent a convenient authority."

actual_goal:
  audience_outcome: >-
    The intended person understands the offer or task, trusts nearby proof,
    can act or recover, and remembers a distinct human studio.
  costliest_false_success: >-
    A beautiful, system-compliant artifact that hides proof, weakens usability,
    feels generic, or makes every project resemble pitch.dog.

typography:
  authority_repository: "https://github.com/bomkino/pitchdog-type-system"
  authority_reference: "../references/typography-authority.md"
  policy: "resolve-verify-pin-consume"
  existing_artifact: "Preserve its immutable pin until migration is authorized."
  never_cache_here: "font binaries, family names, role values, scales, measures, wrapping rules, or CSS"
  failure_mode: "If source authorities disagree or cannot be accessed, keep typography unresolved."

digital:
  authority_reference: "../references/digital-theme-and-icons.md"
  scope: "all new digital work; existing-artifact expansion requires authority"
  theme:
    choices: ["system", "light", "dark"]
    default: "system"
    light_and_dark: "independently-authored"
    external_brand_rule: "Preserve accepted values; label a missing derived mode provisional until owner acceptance."
  icons:
    family: "Phosphor Icons"
    external_brand_rule: "Preserve an accepted external family; otherwise use Phosphor provisionally until owner acceptance."
    project_version_rule: "Pin the official adapter in the consuming project's lockfile."
    minimum_target_css_px: 44
    destructive_action: "never-icon-alone; require visible text or equally explicit adjacent confirmation"
    exception: "Typographic arrows inside text follow the resolved type-system contract."

design_language:
  website_reference: "../references/website-design-language.md"
  governing_sentence: "Quiet field. Loud work. One strange little thing."
  cadence:
    scope: "authored editorial scenes, not dense task surfaces"
    primary_events_per_scene: 1
    secondary_whispers_per_scene: "0-or-1"
  anti_template: "Relationships and judgment may travel; page recipes and named scenes may not."

colour_and_material:
  authority_reference: "../references/colour-and-material.md"
  universal_boundary: "Preserve approved proof and never add grain, noise, turbulence, distressed overlays, or pseudo-texture."
  mindset_rule: "Accepted target-brand material language wins except for the universal boundary."

components:
  authority_reference: "../references/design-system-governance.md"
  principle: "Instruments, not skins."
  extraction_gate: "Two representative real uses; otherwise keep a local pilot."

motion:
  authority_reference: "../references/motion-and-interaction.md"
  decision_order: "frequency-purpose-behaviour-origin-access-evidence"
  hard_rules:
    - "No motion quota or high-frequency keyboard motion."
    - "Start interruption from the live presentation value."
    - "Keep an excellent still and a complete reduced-motion state."
    - "Calibration values are project evidence, never global production tokens."

responsive_and_accessibility:
  authority_reference: "../references/responsive-accessibility-performance.md"
  phone: "Author priority, sequence, density, proof, crop, and interaction."
  target: "WCAG 2.2 AA where applicable; conformance requires finished-artifact evidence."

non_web:
  authority_reference: "../references/non-web-adapters.md"
  rule: "Translate meaning through the medium; do not paste digital geometry or controls into physical work."

external_brand:
  authority_reference: "../references/external-brand-adapter.md"
  rule: "Transfer judgment, not pitch.dog identity."

review:
  authority_reference: "../references/artifact-review.md"
  rule: "Diagnose before changing; inspect the artifact; report unperformed checks."

universal:
  proof: "Real work precedes broad claims; preserve source colour, crop authority, credits, rights, and facts."
  missing_proof: "Reduce, withhold, or name an internal placeholder; never manufacture public proof."
  illustration: "Treat an illustration as a complete visual poem, not a mascot parts bin."
  owner_gate: "Only the owner accepts consequential creative work."

evidence:
  separate_states:
    - "edited"
    - "built"
    - "rendered"
    - "checked"
    - "installed"
    - "deployed"
    - "published"
    - "live"
    - "accepted"
  stop: "The artifact does its real job; material risks are resolved or named; another change would be decorative churn."
