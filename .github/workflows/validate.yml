name: Validate skill

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validator dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate source package
        run: python scripts/validate-skill.py

      - name: Prove deterministic archive
        run: |
          python scripts/package-skill.py --output dist/first.zip
          python scripts/package-skill.py --output dist/second.zip
          cmp dist/first.zip dist/second.zip
